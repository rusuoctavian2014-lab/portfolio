<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Octavian Rusu — Photography, aerial and visual design portfolio.">
<title>Octavian Rusu — Visual Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--fg:#f3f3f0;--muted:#8c8c8a;--line:#242424}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Arial,sans-serif}
header{position:fixed;z-index:20;top:0;left:0;right:0;padding:24px 4vw;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#080808e8,transparent);pointer-events:none}
.logo{font-family:"Space Grotesk";font-weight:600;letter-spacing:-.04em;font-size:20px;pointer-events:auto}.logo span{color:#777}
nav{display:flex;gap:24px;pointer-events:auto}nav a{color:#aaa;text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.14em}nav a:hover{color:#fff}
.hero{min-height:78vh;display:flex;align-items:flex-end;padding:0 4vw 8vh;border-bottom:1px solid var(--line)}
.hero h1{font-family:"Space Grotesk";font-size:clamp(56px,11vw,150px);line-height:.82;letter-spacing:-.075em;margin:0;max-width:1050px}.hero p{color:var(--muted);max-width:420px;line-height:1.6;margin:28px 0 0;font-size:14px}
.controls{position:sticky;top:0;z-index:10;background:#080808f2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 4vw;display:flex;gap:10px;overflow:auto}
.filter{border:1px solid #303030;background:none;color:#999;padding:9px 14px;border-radius:100px;white-space:nowrap;cursor:pointer;font:12px Inter}.filter.active,.filter:hover{color:#fff;border-color:#777}
.grid{padding:34px 4vw 100px;columns:3 280px;column-gap:14px}
.card{break-inside:avoid;margin:0 0 14px;position:relative;overflow:hidden;background:#111;cursor:pointer;border-radius:2px}.card img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .4s}.card:hover img{transform:scale(1.025)}.card .meta{position:absolute;left:0;right:0;bottom:0;padding:42px 15px 14px;background:linear-gradient(transparent,#000c);opacity:0;transition:.3s}.card:hover .meta{opacity:1}.meta small{color:#bbb;font-size:10px;text-transform:uppercase;letter-spacing:.12em}
.empty{grid-column:1/-1;text-align:center;color:#666;padding:80px 20px;line-height:1.7}
footer{border-top:1px solid var(--line);padding:28px 4vw 50px;color:#666;font-size:12px;display:flex;justify-content:space-between}
.lightbox{position:fixed;inset:0;background:#000f;z-index:50;display:none;align-items:center;justify-content:center;padding:5vh 5vw}.lightbox.open{display:flex}.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain}.close,.prev,.next{position:absolute;border:0;background:none;color:#fff;cursor:pointer;font-size:30px}.close{right:25px;top:18px}.prev{left:20px}.next{right:20px}
@media(max-width:700px){header{padding:18px 5vw}.hero{min-height:70vh;padding:0 5vw 55px}.hero h1{font-size:18vw}.hero p{font-size:13px}.grid{columns:2 150px;padding:22px 3vw 70px;column-gap:7px}.card{margin-bottom:7px}.controls{padding:12px 3vw}nav{display:none}.lightbox{padding:20px}.prev,.next{font-size:24px}.prev{left:8px}.next{right:8px}footer{padding:22px 5vw;display:block}}
</style>
</head>
<body>
<header><div class="logo">OCTAVIAN<span>RUSU</span></div><nav><a href="#work">Work</a><a href="#about">About</a></nav></header>
<section class="hero" id="about"><div><h1>VISUAL<br>STORIES.</h1><p>Photography, aerial imagery and visual design by Octavian Rusu. Moments, places and details — captured with intention.</p></div></section>
<div class="controls" id="work"><button class="filter active" data-cat="All">All</button><button class="filter" data-cat="Sea & Wildlife">Sea & Wildlife</button><button class="filter" data-cat="Aerial">Aerial</button><button class="filter" data-cat="Urban">Urban</button><button class="filter" data-cat="Cinematic">Cinematic</button><button class="filter" data-cat="Graphic Design">Graphic Design</button></div>
<main class="grid" id="gallery"><div class="empty">Add your images to the category folders, then run <b>UPDATE WEBSITE.bat</b>.</div></main>
<div class="lightbox" id="lightbox"><button class="close" aria-label="Close">×</button><button class="prev" aria-label="Previous">‹</button><img id="lightboxImg" alt=""><button class="next" aria-label="Next">›</button></div>
<footer><span>© 2026 Octavian Rusu</span><span>Photography · Aerial · Design</span></footer>
<script src="gallery.js"></script>
<script>
const gallery=document.getElementById('gallery'), filters=document.querySelectorAll('.filter'), lb=document.getElementById('lightbox'), lbImg=document.getElementById('lightboxImg');
let shown=[],pos=0;
function render(cat='All'){
 gallery.innerHTML='';
 shown=(window.PORTFOLIO_IMAGES||[]).filter(x=>cat==='All'||x.category===cat);
 if(!shown.length){gallery.innerHTML='<div class="empty">No images in this category yet.</div>';return}
 shown.forEach((x,i)=>{const c=document.createElement('article');c.className='card';c.innerHTML=`<img src="${encodeURI(x.path)}" loading="lazy" alt="${x.title||''}"><div class="meta"><small>${x.category}</small></div>`;c.onclick=()=>open(i);gallery.appendChild(c)})
}
function open(i){pos=i;lbImg.src=shown[pos].path;lbImg.alt=shown[pos].title||'';lb.classList.add('open')}
function move(d){if(!shown.length)return;pos=(pos+d+shown.length)%shown.length;lbImg.src=shown[pos].path}
filters.forEach(b=>b.onclick=()=>{filters.forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)})
document.querySelector('.close').onclick=()=>lb.classList.remove('open');document.querySelector('.prev').onclick=()=>move(-1);document.querySelector('.next').onclick=()=>move(1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
render();
</script>
</body>
</html>
